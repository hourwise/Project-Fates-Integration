name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration

      - name: Checkout approved Ananke
        uses: actions/checkout@v4
        with:
          repository: hourwise/Project-Ananke
          ref: e7b405f3a217db6df31fe9ba7bde376ab666930c
          path: ananke
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Integration dependencies
        working-directory: integration
        run: npm ci

      - name: Install approved Ananke dependencies
        working-directory: ananke
        run: npm ci

      - name: Build approved Ananke
        working-directory: ananke
        run: npm run build

      - name: Verify approved Ananke provenance and artifacts
        working-directory: integration
        env:
          FATES_ANANKE_ROOT: ${{ github.workspace }}/ananke
        run: node scripts/fates-slice04a-ananke-runtime.mjs --root "$FATES_ANANKE_ROOT" --require-approved-sha

      - name: Verify approved Ananke checkout
        working-directory: ananke
        run: test "$(git rev-parse HEAD)" = "e7b405f3a217db6df31fe9ba7bde376ab666930c"

      - name: Validate
        working-directory: integration
        env:
          FATES_ANANKE_ROOT: ${{ github.workspace }}/ananke
        run: npm run validate

      - name: Check whitespace
        working-directory: integration
        run: git diff --check
